name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Check scripts and deployment files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py scripts/fakes/*.py deploy/*.py
          python3 -m unittest discover -s deploy -p 'test_*.py'
          bash -n deploy/*.sh scripts/*.sh
          test_directory=$(mktemp -d)
          trap 'rm -rf "${test_directory}"' EXIT
          sed 's#/usr/local/bin/mcserver-control-plane#/usr/bin/true#g' \
            deploy/systemd/mcserver-control-plane.service \
            > "${test_directory}/mcserver-control-plane.service"
          systemd-analyze verify "${test_directory}/mcserver-control-plane.service"
          systemd-sysusers --dry-run \
            "${PWD}/deploy/systemd/mcserver-control-plane.sysusers.conf"

      - name: Build integration binaries
        run: cargo build --locked --workspace

      - name: Run deterministic local vertical slice
        run: python3 scripts/deterministic_e2e.py

      - name: Run deterministic remote provider slice
        run: python3 scripts/remote_provider_e2e.py
