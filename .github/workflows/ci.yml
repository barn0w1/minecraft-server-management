name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check Python scripts
        run: python3 -m py_compile scripts/*.py scripts/fakes/*.py

      - name: Build integration binaries
        run: cargo build --workspace

      - name: Run deterministic local vertical slice
        run: python3 scripts/deterministic_e2e.py

      - name: Run deterministic remote provider slice
        run: python3 scripts/remote_provider_e2e.py
